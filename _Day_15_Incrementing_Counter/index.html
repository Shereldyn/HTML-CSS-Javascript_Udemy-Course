<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Incrementing Counter</title>
</head>

<body>
    <div class="counter-container">
        <i class="fab fa-twitter fa-3x"></i>
        <!--
        *when you are using social media icons in Font Awesome, it is 'fab' class and NOT 'fas'
        you can also increase the size using Font Awesome by adding the class 'fa-3x', this increases the size 3 times.
        -->
        <div class="counter" data-count-to="12000"></div>
        <!--
        //<div ...>12000</div>
        was initially hardcoded but the number will ultimately come from a custom data attribute
        // data-target=12000
        // removed to prevent framework conflicts, and to make code easier to read and maintain later
        -->
        <span>Twitter Followers</span>
    </div>

    <div class="counter-container">
        <i class="fab fa-youtube fa-3x"></i>
        <div class="counter" data-count-to="5000"></div>
        <span>YouTube Subscribers</span>
    </div>

    <div class="counter-container">
        <i class="fab fa-facebook fa-3x"></i>
        <div class="counter" data-count-to="7500"></div>
        <span>Facebook Fans</span>
    </div>

    <script src="script.js"></script>
</body>

</html>
