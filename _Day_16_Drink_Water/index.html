<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    -->
    <link rel="stylesheet" href="style.css">
    <title>Drink Water</title>
</head>

<body>
    <h1>Drink Water</h1>
    <h3>Goal: 2 Litres</h3>

    <div class="cup"><!--*big jar-->
        <div class="remained" id="remainedID"><!--amount of the jar that is empty-->
            <span id="litres">1.5L</span>
            <small>Remained</small>
        </div>

        <div class="percentage" id="percentageID"><!--percentage of the jar that is filled-->
            20%
        </div>
    </div>

    <p class="text">Select how many glasses of water that you have drank</p>

    <div class="cups"><!--*smaller cups-->
        <div class="cup cup-small full">250 ml</div>
        <!--
        #Cups that have the additional class `full` will be filled with the color blue
        #While the cups WITHOUT the `full` class will be filled with the same color as the background
        -->
        <div class="cup cup-small full">250 ml</div>
        <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
        <div class="cup cup-small">250 ml</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
