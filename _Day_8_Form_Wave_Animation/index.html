<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    -->
    <link rel="stylesheet" href="style.css">
    <title>Form Wave Animation</title>
</head>

<body>
    <div class="container"> <!--container wrapping around the form-->
        <h1>Please Login</h1>
        <form> <!--*Essentially groups all the inputs within it so they are able to be submitted together-->
            <div class="form-control"> <!--*wraps around email input but has the same class as the password input because it will share the same styling-->
                <input type="text" required> <!--required results in the browser sending a validation message if the input is blank-->
                <label>Email</label>
                <!-- 
                this is just a visual example of what it could look like when we wrap the span around the transitions of the letters
                **<label>
                **    <span style="transition-delay: 0ms;">E</span>
                **    <span style="transition-delay: 50ms;">m</span>
                **    <span style="transition-delay: 100ms;">a</span>
                **    <span style="transition-delay: 150ms;">i</span>
                **    <span style="transition-delay: 200ms;">l</span>
                **</label> 
                -->
            </div>

            <div class="form-control"> <!--wraps around password input-->
                <input type="password" required>
                <label>Password</label>
            </div>

            <button class="btn">Login</button>

            <p class="text">
                Don't have an account
                <a href="#">Register</a> <!--doesn't do anything-->
            </p>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
